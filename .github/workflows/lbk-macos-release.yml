name: LBK macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "lbk-v*"

concurrency:
  group: lbk-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  MACOSX_DEPLOYMENT_TARGET: "13.3"
  OPENSSL_VERSION: "3.5.9"

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode on macos-14 ships a libc++ too old for this tree; macos-15 has a current one.
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install build tools
        run: |
          brew install ninja cmake || true
          cmake --version
          clang --version

      - name: Resolve version
        id: version
        run: |
          upstream="$(grep -v '^#' scripts/version | tr -d '[:space:]' | sed 's/^v//')"
          if [[ "${GITHUB_REF}" == refs/tags/lbk-v* ]]; then
            version="${GITHUB_REF_NAME#lbk-v}"
          else
            version="${upstream}-lbk.0-dev.${GITHUB_SHA::7}"
          fi
          echo "upstream=${upstream}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Upstream ${upstream}, release ${version}"

      - name: Cache OpenSSL
        uses: actions/cache@v4
        with:
          path: build/lbk-deps/${{ matrix.arch }}
          key: lbk-openssl-${{ env.OPENSSL_VERSION }}-${{ matrix.arch }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ matrix.runner }}-v1

      - name: Build
        run: bash scripts/macos/lbk/build.sh "${{ matrix.arch }}"

      - name: Assemble and verify bundle
        run: bash scripts/macos/lbk/bundle.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}" "${{ github.workspace }}/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: millennium-darwin-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/lbk-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          cat > notes.md <<EOF
          Self-contained macOS build of Millennium (wrapper-app install, CDP over pipes).

          Built from ${GITHUB_SHA} on branch lbk-macos. No Homebrew needed: OpenSSL is linked statically and every binary depends only on /usr/lib and /System. Minimum macOS ${MACOSX_DEPLOYMENT_TARGET}.

          Install from the extracted archive (quit Steam first):

              tar -xzf millennium-<version>-darwin-<arch>.tar.gz
              bash millennium-<version>-darwin-<arch>/install_macos.sh --from-bundle millennium-<version>-darwin-<arch>

          Then launch Steam through "Steam Millennium.app".
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Millennium ${TAG#lbk-v} (macOS)" --notes-file notes.md --verify-tag
          else
            gh release edit "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
